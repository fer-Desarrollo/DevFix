<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Comentarios - DevFix</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Courier New', monospace; /* Fuente tipo código */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            border: 1px solid #333;
            width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h2 { color: #39ff14; text-align: center; border-bottom: 1px solid #333; padding-bottom: 20px; }

        input, textarea {
            width: 100%;
            background: #2b2b2b;
            border: none;
            border-bottom: 2px solid #39ff14;
            color: white;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box; /* Para que no se salga del borde */
            font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; background: #333; }

        button {
            width: 100%;
            background: #39ff14;
            color: black;
            border: none;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        button:hover { background: white; }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #777; text-decoration: none; font-size: 0.9em; }
        .back-link:hover { color: #39ff14; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>< SYSTEM FEEDBACK ></h2>
    <form action="#" method="post">
        <label>USUARIO:</label>
        <input type="text" name="nombre" placeholder="Ingresa tu nombre">

        <label>DATA ENTRY:</label>
        <textarea name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>

        <button type="submit">ENVIAR DATOS</button>
    </form>
    <a href="/nosotros" class="back-link"><< VOLVER AL SISTEMA</a>
</div>
</body>
</html>
