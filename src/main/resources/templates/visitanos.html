<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Visítanos - DevFix</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #121212; /* Fondo oscuro elegante */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #39ff14; text-transform: uppercase; letter-spacing: 2px; } /* Verde Neón */

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .info-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
            width: 300px;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.1);
            transition: transform 0.3s;
        }
        .info-card:hover {
            transform: translateY(-5px);
            border-color: #39ff14;
        }
        .icon { font-size: 40px; color: #39ff14; margin-bottom: 10px; }

        .map-container {
            width: 85%;
            height: 450px;
            margin: 40px auto;
            border: 2px solid #39ff14;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
            position: relative;
        }

        a { color: #39ff14; text-decoration: none; font-weight: bold; font-size: 1.1em; }
        a:hover { color: white; text-decoration: underline; }
    </style>
</head>
<body>
<h1><i class="fas fa-map-marker-alt"></i> Encuentra DevFix</h1>
<p>Tecnología y soporte en el corazón de Cuautitlán.</p>

<div class="container">
    <div class="info-card">
        <div class="icon"><i class="fas fa-building"></i></div>
        <h3>Oficinas Centrales</h3>
        <p>Av. Dr. Jiménez Cantú 510<br>Centro Urbano, Cuautitlán Izcalli<br>CP 54700, Edo. Méx.</p>
    </div>

    <div class="info-card">
        <div class="icon"><i class="fas fa-clock"></i></div>
        <h3>Horario de Atención</h3>
        <p>Lunes a Viernes<br>9:00 AM - 6:00 PM</p>
    </div>
</div>

<div class="map-container">
    <iframe
            width="100%"
            height="100%"
            id="gmap_canvas"
            src="https://maps.google.com/maps?q=Av.+Dr.+Jimenez+Cantu+510,+Centro+Urbano,+Cuautitlan+Izcalli&t=&z=15&ie=UTF8&iwloc=&output=embed"
            frameborder="0"
            scrolling="no"
            marginheight="0"
            marginwidth="0">
    </iframe>
</div>

<br>
<a href="/nosotros"><i class="fas fa-arrow-left"></i> Volver a Nosotros</a>
</body>
</html>
